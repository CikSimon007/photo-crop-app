name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install PySide6>=6.6 Pillow>=10.0 pyinstaller>=6.0

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "Orezavanie-fotiek" --noconfirm main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Orezavanie-fotiek-Windows
          path: dist/Orezavanie-fotiek.exe
